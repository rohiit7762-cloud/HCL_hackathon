[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Enterprise Intelligent Knowledge Assistant: agentic RAG copilot with access-controlled retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- API & contracts (Claude) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    # --- LLM & orchestration (Claude) ---
    "groq>=0.11",
    "langgraph>=0.2.60",
    "tenacity>=9.0",
    # --- Frontend (Claude) ---
    "streamlit>=1.38",
    "httpx>=0.27",
    # --- Data layer ---
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "chromadb>=1.0",
    "fastembed>=0.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_demo_data.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "frontend"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "rapidocr_onnxruntime", "fastembed", "chromadb", "chromadb.*"]
ignore_missing_imports = true
